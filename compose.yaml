services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cep_api
      POSTGRES_USER: cep_api
      POSTGRES_PASSWORD: cep_api_dev
    ports:
      - "5432:5432"
    volumes:
      - cep_api_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cep_api -d cep_api"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  migrate:
    build:
      context: .
    command: ["migrate"]
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=cep_api;Username=cep_api;Password=cep_api_dev
      Email__Host: mailpit
      Email__Port: 1025
      Email__UseSsl: "false"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
    environment: *api-environment
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  cep_api_postgres:
